<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CS Risk Command · ITSM</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0b0d14;--surface:#111420;--surface2:#171b2a;--surface3:#1d2236;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#e2e4ee;--muted:#5a607a;--muted2:#8890aa;
  --crit:#f87171;--critbg:#2d1111;
  --high:#fbbf24;--highbg:#2d1f00;
  --med:#60a5fa;--medbg:#0d1f3a;
  --low:#34d399;--lowbg:#052318;
  --accent:#818cf8;--accentbg:rgba(129,140,248,.12);
  --sim:#c084fc;--simbg:rgba(192,132,252,.1);--simborder:rgba(192,132,252,.3);
  --mono:'IBM Plex Mono',monospace;--sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* TOP BAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(129,140,248,.4);}50%{opacity:.6;box-shadow:0 0 0 6px rgba(129,140,248,0);}}
.brand-name{font-size:14px;font-weight:600;letter-spacing:-.01em;color:#fff;}
.brand-sub{font-size:11px;color:var(--muted);margin-left:2px;}
.topbar-stats{display:flex;gap:24px;}
.ts{text-align:center;}
.ts-val{font-family:var(--mono);font-size:15px;font-weight:500;}
.ts-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:1px;}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden;}

/* SIDEBAR */
.sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);}
.sidebar-head{padding:12px 14px;border-bottom:1px solid var(--border);}
.search-wrap{position:relative;}
.search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:12px;padding:7px 10px 7px 30px;border-radius:6px;outline:none;}
.search-wrap input::placeholder{color:var(--muted);}
.search-wrap input:focus{border-color:var(--accent);}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none;}
.sidebar-filters{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid var(--border);}
.ftag{font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;border:1px solid var(--border2);color:var(--muted2);background:transparent;transition:all .15s;font-family:var(--sans);}
.ftag.active-all{border-color:var(--accent);color:var(--accent);background:rgba(129,140,248,.1);}
.ftag.active-c{border-color:var(--crit);color:var(--crit);background:rgba(248,113,113,.1);}
.ftag.active-h{border-color:var(--high);color:var(--high);background:rgba(251,191,36,.1);}
.ftag.active-m{border-color:var(--med);color:var(--med);background:rgba(96,165,250,.1);}
.ftag.active-l{border-color:var(--low);color:var(--low);background:rgba(52,211,153,.1);}
.account-list{flex:1;overflow-y:auto;padding:4px 0;}
.account-list::-webkit-scrollbar{width:4px;}
.account-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
.acc-item{padding:9px 14px;cursor:pointer;border-left:3px solid transparent;transition:all .12s;display:flex;justify-content:space-between;align-items:center;}
.acc-item:hover{background:var(--surface2);}
.acc-item.selected{background:var(--surface2);border-left-color:var(--accent);}
.acc-name{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
.acc-meta{font-size:10px;color:var(--muted);margin-top:2px;}
.acc-score{font-family:var(--mono);font-size:12px;font-weight:500;flex-shrink:0;margin-left:6px;}
.score-c{color:var(--crit);}
.score-h{color:var(--high);}
.score-m{color:var(--med);}
.score-l{color:var(--low);}

/* MAIN */
.main{flex:1;display:flex;overflow:hidden;}
.center{flex:1;overflow-y:auto;padding:20px;}
.center::-webkit-scrollbar{width:4px;}
.center::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* ACCOUNT HEADER */
.acc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.acc-title{font-size:22px;font-weight:600;color:#fff;letter-spacing:-.02em;}
.acc-subtitle{display:flex;gap:14px;margin-top:5px;flex-wrap:wrap;align-items:center;}
.acc-pill{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;}
.acc-pill span{color:var(--text);}
.renewal-warn{font-size:11px;padding:3px 8px;border-radius:4px;}
.header-actions{display:flex;gap:8px;flex-shrink:0;align-items:center;}
.btn-sim{font-size:11px;font-weight:600;padding:7px 13px;border-radius:6px;cursor:pointer;font-family:var(--sans);transition:all .18s;border:1px solid var(--simborder);color:var(--sim);background:var(--simbg);display:flex;align-items:center;gap:6px;letter-spacing:.02em;}
.btn-sim:hover{background:rgba(192,132,252,.18);}
.btn-sim.active{background:rgba(192,132,252,.2);box-shadow:0 0 0 1px var(--sim);}
.btn-apply{font-size:11px;font-weight:600;padding:7px 13px;border-radius:6px;cursor:pointer;font-family:var(--sans);border:1px solid rgba(52,211,153,.4);color:var(--low);background:rgba(52,211,153,.08);transition:all .15s;}
.btn-apply:hover{background:rgba(52,211,153,.15);}
.btn-discard{font-size:11px;padding:7px 13px;border-radius:6px;cursor:pointer;font-family:var(--sans);border:1px solid var(--border2);color:var(--muted2);background:transparent;transition:all .15s;}
.btn-discard:hover{background:var(--surface2);}

/* SIM BANNER */
.sim-banner{background:var(--simbg);border:1px solid var(--simborder);border-radius:8px;padding:9px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sim);}
.sim-banner-dot{width:7px;height:7px;border-radius:50%;background:var(--sim);animation:pulse 2s infinite;}

/* SIGNAL SECTION */
.signal-section-label{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.signal-section-label::after{content:'';flex:1;height:1px;background:var(--border);}
.signal-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px;}

/* SIMULATE SPLIT */
.sim-split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.sim-col-label{font-size:9px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;padding:4px 8px;border-radius:4px;display:inline-block;}
.sim-col-current .sim-col-label{color:var(--muted2);background:var(--surface2);border:1px solid var(--border2);}
.sim-col-simulated .sim-col-label{color:var(--sim);background:var(--simbg);border:1px solid var(--simborder);}
.sim-col-current .signal-card{opacity:.7;}
.sim-col-current .tog{pointer-events:none;cursor:default;}

.signal-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;}
.signal-card.active-c{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.04);}
.signal-card.active-h{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.04);}
.signal-card.active-m-blue{border-color:rgba(96,165,250,.35);background:rgba(96,165,250,.04);}
.signal-card.active-l{border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.04);}
.signal-card.sim-card{border-color:var(--simborder);background:var(--simbg);}
.signal-icon{font-size:16px;margin-bottom:8px;display:block;}
.signal-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px;}
.signal-name{font-size:13px;font-weight:600;color:#fff;margin-bottom:4px;}
.signal-weight{font-size:10px;color:var(--muted);margin-bottom:12px;}
.toggle-group{display:flex;gap:4px;}
.tog{flex:1;padding:6px 4px;text-align:center;font-size:11px;font-weight:600;border-radius:6px;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--muted2);font-family:var(--sans);transition:all .15s;letter-spacing:.02em;}
.tog:hover{color:var(--text);}
.tog.sel-h{background:var(--critbg);border-color:var(--crit);color:var(--crit);}
.tog.sel-m{background:var(--highbg);border-color:var(--high);color:var(--high);}
.tog.sel-l{background:var(--lowbg);border-color:var(--low);color:var(--low);}
.tog.sel-sim{background:var(--simbg);border-color:var(--sim);color:var(--sim);}
.signal-hint{font-size:10px;color:var(--muted);margin-top:8px;line-height:1.5;}

/* SCORE PANEL */
.score-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:20px;display:flex;align-items:center;gap:20px;}
.score-panel.sim-panel{border-color:var(--simborder);}
.gauge-wrap{position:relative;flex-shrink:0;}
.gauge-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-38%);text-align:center;}
.gauge-num{font-family:var(--mono);font-size:28px;font-weight:500;line-height:1;transition:all .3s;}
.gauge-denom{font-size:10px;color:var(--muted);margin-top:1px;}
.gauge-sublabel{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:6px;}
.score-info{flex:1;}
.risk-badge-big{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;letter-spacing:.03em;margin-bottom:10px;transition:all .3s;}
.risk-c{background:var(--critbg);border:1px solid var(--crit);color:var(--crit);}
.risk-h{background:var(--highbg);border:1px solid var(--high);color:var(--high);}
.risk-m{background:var(--medbg);border:1px solid var(--med);color:var(--med);}
.risk-l{background:var(--lowbg);border:1px solid var(--low);color:var(--low);}
.score-breakdown{display:flex;gap:8px;flex-wrap:wrap;}
.sb-item{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;flex:1;min-width:72px;}
.sb-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.sb-val{font-family:var(--mono);font-size:14px;font-weight:500;transition:color .3s;}
.sb-bar-track{height:3px;background:var(--border2);border-radius:2px;margin-top:4px;}
.sb-bar{height:3px;border-radius:2px;transition:width .4s,background .3s;}

/* SCORE COMPARE */
.score-compare{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;margin-bottom:20px;align-items:center;}
.score-compare-divider{display:flex;flex-direction:column;align-items:center;gap:6px;}
.delta-badge{font-family:var(--mono);font-size:13px;font-weight:600;padding:5px 10px;border-radius:6px;text-align:center;}
.delta-pos{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);color:var(--low);}
.delta-neg{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--crit);}
.delta-neu{background:var(--surface2);border:1px solid var(--border2);color:var(--muted2);}
.delta-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.score-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;}
.score-box.sim-box{border-color:var(--simborder);background:var(--simbg);}
.score-box-label{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;}
.score-box.sim-box .score-box-label{color:var(--sim);}
.score-box-num{font-family:var(--mono);font-size:36px;font-weight:500;line-height:1;}
.score-box-tier{font-size:12px;font-weight:600;margin-top:6px;padding:3px 9px;border-radius:4px;display:inline-block;}

/* PLAYBOOK */
.playbook{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;}
.pb-head{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.pb-head::after{content:'';flex:1;height:1px;background:var(--border);}
.pb-actions{display:flex;flex-direction:column;gap:8px;}
.pb-action{display:flex;gap:12px;padding:10px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);align-items:flex-start;transition:border-color .2s;}
.pb-action:hover{border-color:var(--border2);}
.pb-num{font-family:var(--mono);font-size:11px;color:var(--muted);flex-shrink:0;margin-top:1px;width:18px;}
.pb-text{font-size:12px;line-height:1.6;color:var(--text);flex:1;}
.pb-text strong{color:#fff;font-weight:600;}
.pb-priority{font-size:9px;font-weight:600;padding:2px 6px;border-radius:3px;flex-shrink:0;margin-top:2px;}
.pri-now{background:var(--critbg);color:var(--crit);border:1px solid var(--crit);}
.pri-soon{background:var(--highbg);color:var(--high);border:1px solid var(--high);}
.pri-plan{background:var(--medbg);color:var(--med);border:1px solid var(--med);}
.pri-growth{background:var(--lowbg);color:var(--low);border:1px solid var(--low);}

/* RIGHT PANEL */
.right-panel{width:230px;flex-shrink:0;border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;display:flex;flex-direction:column;}
.right-panel::-webkit-scrollbar{width:4px;}
.right-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
.rp-section{padding:14px 14px 0;margin-bottom:16px;}
.rp-title{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.rp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.rp-lbl{font-size:11px;color:var(--muted2);}
.rp-val{font-size:11px;font-weight:500;font-family:var(--mono);color:var(--text);}

/* NOTES */
.notes-wrap{padding:0 14px 14px;}
.notes-label{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.notes-saved{font-size:9px;color:var(--low);opacity:0;transition:opacity .3s;}
.notes-saved.show{opacity:1;}
textarea.notes-input{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:11px;line-height:1.6;padding:9px 10px;border-radius:6px;resize:vertical;min-height:100px;outline:none;transition:border-color .15s;}
textarea.notes-input::placeholder{color:var(--muted);}
textarea.notes-input:focus{border-color:var(--accent);}
.notes-meta{font-size:9px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;}

/* HISTORY */
.history-section{padding:0 14px 14px;flex:1;}
.history-item{padding:7px 0;border-bottom:1px solid var(--border);font-size:11px;}
.hist-time{font-size:9px;color:var(--muted);font-family:var(--mono);}
.hist-change{margin-top:2px;color:var(--text);}

/* MISC */
.rdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.rdot-c{background:var(--crit);}
.rdot-h{background:var(--high);}
.rdot-m{background:var(--med);}
.rdot-l{background:var(--low);}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .es-icon{font-size:32px;margin-bottom:12px;display:block;}
.empty-state p{font-size:12px;line-height:1.8;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="brand-dot"></div>
    <span class="brand-name">CS Risk Command</span>
    <span class="brand-sub">· ITSM Operations</span>
  </div>
  <div class="topbar-stats">
    <div class="ts"><div class="ts-val score-c" id="stat-crit">—</div><div class="ts-lbl">Critical</div></div>
    <div class="ts"><div class="ts-val score-h" id="stat-high">—</div><div class="ts-lbl">High risk</div></div>
    <div class="ts"><div class="ts-val" id="stat-total">—</div><div class="ts-lbl">Accounts</div></div>
    <div class="ts"><div class="ts-val" id="stat-avg">—</div><div class="ts-lbl">Avg health</div></div>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-head">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="search" placeholder="Search accounts…" oninput="filterList()"/>
      </div>
    </div>
    <div class="sidebar-filters">
      <button class="ftag active-all" data-f="" onclick="setFilter(this,'')">All</button>
      <button class="ftag" data-f="Critical" onclick="setFilter(this,'Critical')">Crit</button>
      <button class="ftag" data-f="High" onclick="setFilter(this,'High')">High</button>
      <button class="ftag" data-f="Medium" onclick="setFilter(this,'Medium')">Med</button>
      <button class="ftag" data-f="Low" onclick="setFilter(this,'Low')">Low</button>
    </div>
    <div class="account-list" id="acc-list"></div>
  </div>

  <div class="main">
    <div class="center" id="center-panel">
      <div class="empty-state">
        <span class="es-icon">◎</span>
        <p>Select an account from the list<br>to begin risk assessment</p>
      </div>
    </div>

    <div class="right-panel" id="right-panel">
      <div class="rp-section">
        <div class="rp-title">Account details</div>
        <div id="rp-details"><span style="font-size:11px;color:var(--muted);">No account selected</span></div>
      </div>
      <div class="notes-wrap" id="notes-wrap" style="display:none;">
        <div class="notes-label">
          <span>CSM notes</span>
          <span class="notes-saved" id="notes-saved">Saved</span>
        </div>
        <textarea class="notes-input" id="notes-input" placeholder="Add notes about this account — last call, key contacts, blockers, next steps…" rows="6" oninput="saveNote()" onblur="saveNote()"></textarea>
        <div class="notes-meta">
          <span id="notes-chars">0 chars</span>
          <span id="notes-ts" style="color:var(--muted);"></span>
        </div>
      </div>
      <div class="history-section">
        <div class="rp-title">Change log</div>
        <div id="rp-history"><span style="font-size:11px;color:var(--muted);">No changes yet</span></div>
      </div>
    </div>
  </div>
</div>

<script>
const CO=["Nexus Corp","Vantage Systems","Meridian Tech","Apex Solutions","Pinnacle Data","Orion Software","Stratum IT","Vertex Cloud","Zenith Analytics","Cobalt Systems","Ember Networks","Granite Logic","Harbor Digital","Ironwood Tech","Jasper IT","Keystone Apps","Lattice Ops","Maverick Cloud","Nova Systems","Orbit Platform","Paragon Tech","Quantum Data","Ridgeline IT","Summit Cloud","Torque Systems","Ultra Logic","Vector Works","Waypoint Tech","Xenon Data","Yellowstone IT","Zephyr Cloud","Accel Systems","Beacon Analytics","Cascade Tech","Delta Ops","Eclipse Data","Falcon IT","Galaxy Cloud","Haven Systems","Impact Tech","Junction IT","Kinetic Data","Luminary Cloud","Matrix Ops","Nectar Systems","Oasis Tech","Pulse Analytics","Quest Data","Radius Cloud","Solaris IT","Titan Systems","Unipath Tech","Vortex Data","Westfield IT","Axis Cloud","Blueprint Tech","Citadel Data","Dominion IT","Epoch Systems","Frontier Cloud","Glacier Tech","Horizon Data","Irongate IT","Junction Cloud","Keystroke Tech","Landmark Data","Momentum IT","Nucleus Cloud","Overture Tech","Pathfinder Data","Quantum IT","Riverstone Cloud","Scaffold Tech","Terrain Data","Uplift IT","Venture Cloud","Watershed Tech","Xeno Data","Yield IT","Zenwave Cloud","Arclight Tech","Bastion Data","Centrix IT","Daylight Cloud","Evercore Tech","Flashpoint Data","Groundwork IT","Hillside Cloud","Ingress Tech","Jetstream Data","Keyframe IT","Lowland Cloud","Motive Tech","Northstar Data","Outpost IT","Perimeter Cloud","Quartile Tech","Rockport Data","Skyline IT","Terraform Cloud"];
const IND=["Healthcare","Finance","Manufacturing","Retail","Logistics","Technology","Government","Insurance","Telecom","Education"];
const CSMS=["Sarah Chen","Marcus Williams","Priya Patel","Jake Anderson","Leila Hassan"];
function seed(n){let x=Math.sin(n+1)*10000;return x-Math.floor(x);}
function srng(s,a,b){return seed(s)*(b-a)+a;}
function sri(s,a,b){return Math.floor(srng(s,a,b+.999));}
function spk(s,a){return a[Math.floor(seed(s)*a.length)];}
function initSig(br){return{tickets:br>.7?'High':br>.4?'Medium':'Low',usage:br>.7?'Low':br>.4?'Medium':'High',sentiment:br>.7?'Low':br>.4?'Medium':'High'};}
const SM={tickets:{High:15,Medium:55,Low:85},usage:{Low:15,Medium:55,High:85},sentiment:{Low:15,Medium:50,High:85}};
function calcH(sig){const t=SM.tickets[sig.tickets],u=SM.usage[sig.usage],s=SM.sentiment[sig.sentiment];return{hs:Math.round(t*.35+u*.40+s*.25),t,u,s};}
function tier(hs){return hs<30?'Critical':hs<50?'High':hs<70?'Medium':'Low';}
function tc(t){return t==='Critical'?'c':t==='High'?'h':t==='Medium'?'m':'l';}
function sc(hs){return hs<30?'score-c':hs<50?'score-h':hs<70?'score-m':'score-l';}

const ALL=[];
for(let i=0;i<200;i++){
  const br=srng(i*7,0,1);const sig=initSig(br);const{hs}=calcH(sig);
  ALL.push({id:i,co:CO[i%CO.length],ind:spk(i*3,IND),csm:CSMS[i%CSMS.length],arr:Math.round(srng(i*11,50,2000))*1000,dtr:sri(i*5,10,365),signals:{...sig},hs,tier:tier(hs),note:'',noteTs:null,simSignals:null});
}
ALL.sort((a,b)=>a.hs-b.hs);

const TC={'Critical':'#f87171','High':'#fbbf24','Medium':'#60a5fa','Low':'#34d399'};
let activeFilter='',selectedId=null,changeLog=[],simMode=false;
function fmtARR(v){return v>=1e6?'$'+(v/1e6).toFixed(1)+'M':'$'+Math.round(v/1000)+'K';}

function updateTopStats(){
  document.getElementById('stat-crit').textContent=ALL.filter(a=>a.tier==='Critical').length;
  document.getElementById('stat-high').textContent=ALL.filter(a=>a.tier==='High').length;
  document.getElementById('stat-total').textContent=ALL.length;
  document.getElementById('stat-avg').textContent=Math.round(ALL.reduce((s,a)=>s+a.hs,0)/ALL.length);
}
function filterList(){
  const q=document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.acc-item').forEach(el=>{
    const matchQ=!q||el.dataset.name.toLowerCase().includes(q);
    const matchF=!activeFilter||el.dataset.tier===activeFilter;
    el.style.display=(matchQ&&matchF)?'flex':'none';
  });
}
function setFilter(el,f){
  activeFilter=f;
  document.querySelectorAll('.ftag').forEach(b=>{
    b.className='ftag';
    if(b.dataset.f===f){if(!f)b.classList.add('active-all');else if(f==='Critical')b.classList.add('active-c');else if(f==='High')b.classList.add('active-h');else if(f==='Medium')b.classList.add('active-m');else b.classList.add('active-l');}
  });
  filterList();
}
function buildList(){
  document.getElementById('acc-list').innerHTML=ALL.map(a=>`
    <div class="acc-item" data-id="${a.id}" data-name="${a.co}" data-tier="${a.tier}" onclick="selectAccount(${a.id})">
      <div style="overflow:hidden;"><div class="acc-name">${a.co}</div><div class="acc-meta">${a.ind} · ${a.csm.split(' ')[0]}${a.note?' · 📝':''}</div></div>
      <div><div class="acc-score score-${tc(a.tier)}" id="ls-${a.id}">${a.hs}</div><div style="display:flex;justify-content:center;margin-top:2px;"><div class="rdot rdot-${tc(a.tier)}" id="ld-${a.id}"></div></div></div>
    </div>`).join('');
}

const HINTS={tickets:{High:'8+ open tickets, 2+ critical — support queue overloaded',Medium:'2–7 tickets, minor criticalities — manageable but watch trend',Low:'0–1 tickets — platform running smoothly'},usage:{Low:'DAU declining, adoption <45%, frequent login gaps',Medium:'Stable usage, adoption 45–70%, occasional gaps',High:'DAU growing, adoption >70%, team fully activated'},sentiment:{Low:'NPS negative, CSAT <3.0 — customer is frustrated',Medium:'NPS neutral, CSAT 3–4 — relationship is transactional',High:'NPS positive, CSAT >4.0 — customer is a promoter'}};
const PLAYBOOKS={Critical:[{pri:'pri-now',label:'NOW',text:'<strong>Trigger escalation protocol</strong> — loop in exec sponsor and VP of CS within 24 hours.'},{pri:'pri-now',label:'NOW',text:'<strong>Schedule emergency health check call</strong> this week with a concrete remediation plan.'},{pri:'pri-soon',label:'SOON',text:'<strong>Audit open tickets</strong> — identify root cause pattern across technical, onboarding, and adoption.'},{pri:'pri-soon',label:'SOON',text:'<strong>Review product usage drop</strong> — pull session data, identify which features went dark and when.'},{pri:'pri-soon',label:'SOON',text:'<strong>Assign dedicated support pod</strong> for this account until health score exceeds 50.'},{pri:'pri-plan',label:'PLAN',text:'<strong>Build a 30/60/90 recovery roadmap</strong> with milestones, owners, and success criteria.'}],High:[{pri:'pri-now',label:'NOW',text:'<strong>Proactive outreach within 48 hours</strong> — acknowledge friction before the customer escalates.'},{pri:'pri-soon',label:'SOON',text:'<strong>Check upcoming renewal date</strong> — if under 90 days, escalate to leadership immediately.'},{pri:'pri-soon',label:'SOON',text:'<strong>Schedule a QBR or value review</strong> focused on ROI realized vs. expected.'},{pri:'pri-soon',label:'SOON',text:'<strong>Identify a champion contact</strong> still engaged inside the account.'},{pri:'pri-plan',label:'PLAN',text:'<strong>Create a focused adoption sprint</strong> — pick 2–3 high-value features and build a 30-day plan.'}],Medium:[{pri:'pri-soon',label:'SOON',text:'<strong>Schedule a mid-cycle health check-in</strong> — listen more than you speak.'},{pri:'pri-soon',label:'SOON',text:'<strong>Share a personalized adoption gaps report</strong> to drive deeper platform engagement.'},{pri:'pri-plan',label:'PLAN',text:'<strong>Introduce community resources</strong> — user groups, knowledge base, webinars.'},{pri:'pri-plan',label:'PLAN',text:'<strong>Start renewal conversation early</strong> — 120+ days out is ideal to reinforce value.'}],Low:[{pri:'pri-growth',label:'GROW',text:'<strong>Identify expansion opportunities</strong> — review contract vs. actual usage across teams.'},{pri:'pri-growth',label:'GROW',text:'<strong>Request a case study or G2 review</strong> — strike while sentiment is high.'},{pri:'pri-plan',label:'PLAN',text:'<strong>Nominate for customer advisory board</strong> or beta program.'},{pri:'pri-plan',label:'PLAN',text:'<strong>Send a proactive value summary</strong> ahead of renewal with metrics and ROI.'}]};

function cardActiveClass(key,val){
  if(key==='tickets') return val==='High'?'active-c':val==='Medium'?'active-h':'active-l';
  return val==='High'?'active-l':val==='Medium'?'active-m-blue':'active-c';
}

function renderSignalCard(key,val,isSim,accId){
  const icons={tickets:'🎫',usage:'📊',sentiment:'💬'};
  const names={tickets:'Support tickets',usage:'Product usage',sentiment:'Customer sentiment'};
  const descs={tickets:'Ticket volume & severity',usage:'DAU trend & feature adoption',sentiment:'NPS & CSAT signals'};
  const weights={tickets:'35% weight',usage:'40% weight',sentiment:'25% weight'};
  const display=key==='tickets'?['High','Medium','Low']:['Low','Medium','High'];
  const simClass=isSim?'sim-card':cardActiveClass(key,val);
  const fn=isSim?`setSimSignal(${accId},'${key}'`:`setSignal(${accId},'${key}'`;
  return `<div class="signal-card ${simClass}" id="${isSim?'sim':'cur'}-card-${key}">
    <span class="signal-icon">${icons[key]}</span>
    <div class="signal-label">${descs[key]}</div>
    <div class="signal-name">${names[key]}</div>
    <div class="signal-weight">${weights[key]}</div>
    <div class="toggle-group">
      ${display.map(lv=>{
        const sel=val===lv;
        let cls='';
        if(sel){if(isSim){cls='sel-sim';}else{cls=lv==='High'&&key==='tickets'?'sel-h':lv==='Medium'&&key==='tickets'?'sel-m':lv==='Low'&&key==='tickets'?'sel-l':lv==='High'?'sel-l':lv==='Medium'?'sel-m':'sel-h';}}
        return `<button class="tog ${cls}" onclick="${fn},'${lv}')">${lv}</button>`;
      }).join('')}
    </div>
    <div class="signal-hint" id="${isSim?'sim':'cur'}-hint-${key}">${HINTS[key][val]}</div>
  </div>`;
}

function scoreBar(label,val,key,prefix='sb'){
  const color=val>=70?'#34d399':val>=50?'#60a5fa':val>=30?'#fbbf24':'#f87171';
  return `<div class="sb-item"><div class="sb-lbl">${label}</div><div class="sb-val" style="color:${color}" id="${prefix}-${key}">${val}</div><div class="sb-bar-track"><div class="sb-bar" style="width:${val}%;background:${color};" id="${prefix}-bar-${key}"></div></div></div>`;
}

function renderScorePanel(hs,t,u,s,isSim){
  const tr=tier(hs);
  const col=TC[tr];
  const id=isSim?'sim':'main';
  return `<div class="score-panel${isSim?' sim-panel':''}" id="${id}-score-panel">
    <div class="gauge-wrap">
      <canvas id="${id}-gauge" width="120" height="120"></canvas>
      <div class="gauge-center">
        <div class="gauge-num ${sc(hs)}" id="${id}-gauge-num" style="${isSim?'color:var(--sim)':''}">${hs}</div>
        <div class="gauge-denom">/ 100</div>
      </div>
    </div>
    <div class="score-info">
      <div class="risk-badge-big ${isSim?'':'risk-'+tc(tr)}" id="${id}-risk-badge" style="${isSim?'background:var(--simbg);border:1px solid var(--simborder);color:var(--sim);':''}" >
        <div class="rdot ${isSim?'':'rdot-'+tc(tr)}" style="${isSim?'background:var(--sim);':''}"></div>
        <span id="${id}-risk-label">${tr} Risk${isSim?' (simulated)':''}</span>
      </div>
      <div class="score-breakdown">
        ${scoreBar('Tickets',t,'tickets',id+'-sb')}
        ${scoreBar('Usage',u,'usage',id+'-sb')}
        ${scoreBar('Sentiment',s,'sentiment',id+'-sb')}
      </div>
    </div>
  </div>`;
}

function drawGauge(canvasId,score,color){
  const cv=document.getElementById(canvasId);
  if(!cv)return;
  const c=cv.getContext('2d'),w=120,h=120,cx=w/2,cy=h/2,r=44,lw=9;
  c.clearRect(0,0,w,h);
  const start=Math.PI*.75,end=Math.PI*2.25;
  c.beginPath();c.arc(cx,cy,r,start,end);c.strokeStyle='rgba(255,255,255,0.08)';c.lineWidth=lw;c.lineCap='round';c.stroke();
  const pct=Math.max(0,Math.min(100,score))/100,arcEnd=start+pct*(end-start);
  c.beginPath();c.arc(cx,cy,r,start,arcEnd);c.strokeStyle=color;c.lineWidth=lw;c.lineCap='round';c.stroke();
  const dx=cx+r*Math.cos(arcEnd),dy=cy+r*Math.sin(arcEnd);
  c.beginPath();c.arc(dx,dy,4,0,Math.PI*2);c.fillStyle=color;c.fill();
}

function renderCenter(acc){
  const panel=document.getElementById('center-panel');
  const daysWarn=acc.dtr<60?`<span class="renewal-warn" style="background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.3);">${acc.dtr}d to renewal</span>`:acc.dtr<120?`<span class="renewal-warn" style="background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.3);">${acc.dtr}d to renewal</span>`:`<span class="renewal-warn" style="background:rgba(52,211,153,.08);color:#34d399;border:1px solid rgba(52,211,153,.2);">${acc.dtr}d to renewal</span>`;
  const{hs,t,u,s}=calcH(acc.signals);
  const tr=tier(hs);

  let html=`<div class="acc-header">
    <div>
      <div class="acc-title">${acc.co}</div>
      <div class="acc-subtitle">
        <span class="acc-pill">Industry <span>${acc.ind}</span></span>
        <span class="acc-pill">CSM <span>${acc.csm}</span></span>
        <span class="acc-pill">ARR <span>${fmtARR(acc.arr)}</span></span>
        ${daysWarn}
      </div>
    </div>
    <div class="header-actions">
      ${simMode?`<button class="btn-apply" onclick="applySimulation(${acc.id})">Apply scenario</button><button class="btn-discard" onclick="discardSim(${acc.id})">Discard</button>`:
      `<button class="btn-sim" onclick="startSim(${acc.id})">⟳ Simulate scenario</button>`}
    </div>
  </div>`;

  if(simMode&&acc.simSignals){
    const sim=acc.simSignals;
    const{hs:shs,t:st,u:su,s:ss}=calcH(sim);
    const delta=shs-hs;
    const deltaCls=delta>0?'delta-pos':delta<0?'delta-neg':'delta-neu';
    const deltaStr=delta>0?'+'+delta:delta===0?'±0':delta;

    html+=`<div class="sim-banner"><div class="sim-banner-dot"></div>Simulation mode active — adjust the simulated signals below to explore what-if scenarios</div>`;
    html+=`<div class="sim-split">
      <div class="sim-col sim-col-current">
        <span class="sim-col-label">Current state</span>
        <div class="signal-grid" style="grid-template-columns:1fr;">${['tickets','usage','sentiment'].map(k=>renderSignalCard(k,acc.signals[k],false,acc.id)).join('')}</div>
      </div>
      <div class="sim-col sim-col-simulated">
        <span class="sim-col-label">↯ Simulated scenario</span>
        <div class="signal-grid" style="grid-template-columns:1fr;">${['tickets','usage','sentiment'].map(k=>renderSignalCard(k,sim[k],true,acc.id)).join('')}</div>
      </div>
    </div>`;
    html+=`<div class="score-compare">
      <div class="score-box">
        <div class="score-box-label">Current score</div>
        <div class="score-box-num ${sc(hs)}">${hs}</div>
        <span class="score-box-tier risk-${tc(tr)}">${tr}</span>
      </div>
      <div class="score-compare-divider">
        <div class="delta-badge ${deltaCls}">${deltaStr}</div>
        <div class="delta-label">pts delta</div>
      </div>
      <div class="score-box sim-box">
        <div class="score-box-label">Simulated score</div>
        <div class="score-box-num" style="color:var(--sim)">${shs}</div>
        <span class="score-box-tier" style="background:var(--simbg);border:1px solid var(--simborder);color:var(--sim);">${tier(shs)}</span>
      </div>
    </div>`;
    html+=`<div class="playbook" id="playbook"><div class="pb-head" style="color:var(--sim)">Simulated playbook · ${tier(shs)}</div><div class="pb-actions">${PLAYBOOKS[tier(shs)].map((a,i)=>`<div class="pb-action"><div class="pb-num">0${i+1}</div><div class="pb-text">${a.text}</div><div class="pb-priority ${a.pri}">${a.label}</div></div>`).join('')}</div></div>`;

  } else {
    html+=`<div class="signal-grid">${['tickets','usage','sentiment'].map(k=>renderSignalCard(k,acc.signals[k],false,acc.id)).join('')}</div>`;
    html+=renderScorePanel(hs,t,u,s,false);
    html+=`<div class="playbook" id="playbook"><div class="pb-head">CSM action playbook · ${tr}</div><div class="pb-actions">${PLAYBOOKS[tr].map((a,i)=>`<div class="pb-action"><div class="pb-num">0${i+1}</div><div class="pb-text">${a.text}</div><div class="pb-priority ${a.pri}">${a.label}</div></div>`).join('')}</div></div>`;
  }

  panel.innerHTML=html;
  if(!simMode) drawGauge('main-gauge',hs,TC[tr]);
}

function startSim(id){
  const acc=ALL.find(a=>a.id===id);
  acc.simSignals={...acc.signals};
  simMode=true;
  renderCenter(acc);
}
function discardSim(id){
  const acc=ALL.find(a=>a.id===id);
  acc.simSignals=null;simMode=false;
  renderCenter(acc);
}
function applySimulation(id){
  const acc=ALL.find(a=>a.id===id);
  const prev={...acc.signals};
  acc.signals={...acc.simSignals};
  const{hs}=calcH(acc.signals);
  acc.hs=hs;acc.tier=tier(hs);
  acc.simSignals=null;simMode=false;
  logChange(acc.co,'scenario applied','—','—',hs);
  updateListItem(acc);
  updateTopStats();
  renderCenter(acc);
  renderChangeLog();
}
function setSimSignal(id,key,val){
  const acc=ALL.find(a=>a.id===id);
  if(!acc.simSignals)return;
  acc.simSignals[key]=val;
  renderCenter(acc);
}
function setSignal(id,key,val){
  const acc=ALL.find(a=>a.id===id);
  const prev=acc.signals[key];
  if(prev===val)return;
  acc.signals[key]=val;
  const{hs,t,u,s}=calcH(acc.signals);
  acc.hs=hs;acc.tier=tier(hs);
  logChange(acc.co,key,prev,val,hs);
  updateListItem(acc);
  updateTopStats();

  // Live update without full re-render
  const card=document.getElementById(`cur-card-${key}`);
  if(card){
    card.className=`signal-card ${cardActiveClass(key,val)}`;
    const hint=document.getElementById(`cur-hint-${key}`);
    if(hint)hint.textContent=HINTS[key][val];
    card.querySelectorAll('.tog').forEach(btn=>{
      const bv=btn.textContent.trim();const sel=bv===val;
      btn.className='tog '+(sel?(bv==='High'&&key==='tickets'?'sel-h':bv==='Medium'&&key==='tickets'?'sel-m':bv==='Low'&&key==='tickets'?'sel-l':bv==='High'?'sel-l':bv==='Medium'?'sel-m':'sel-h'):'');
    });
  }
  const gn=document.getElementById('main-gauge-num');if(gn){gn.textContent=hs;gn.className=`gauge-num ${sc(hs)}`;}
  drawGauge('main-gauge',hs,TC[acc.tier]);
  const badge=document.getElementById('main-risk-badge');const lbl=document.getElementById('main-risk-label');
  if(badge&&lbl){badge.className=`risk-badge-big risk-${tc(acc.tier)}`;badge.querySelector('.rdot').className=`rdot rdot-${tc(acc.tier)}`;lbl.textContent=acc.tier+' Risk';}
  [{k:'tickets',v:t},{k:'usage',v:u},{k:'sentiment',v:s}].forEach(({k,v})=>{
    const el=document.getElementById(`main-sb-${k}`),bar=document.getElementById(`main-sb-bar-${k}`);
    const col=v>=70?'#34d399':v>=50?'#60a5fa':v>=30?'#fbbf24':'#f87171';
    if(el){el.textContent=v;el.style.color=col;}if(bar){bar.style.width=v+'%';bar.style.background=col;}
  });
  const oldTier=tier(acc.hs-1);
  if(oldTier!==acc.tier){const pb=document.getElementById('playbook');if(pb){pb.innerHTML=`<div class="pb-head">CSM action playbook · ${acc.tier}</div><div class="pb-actions">${PLAYBOOKS[acc.tier].map((a,i)=>`<div class="pb-action"><div class="pb-num">0${i+1}</div><div class="pb-text">${a.text}</div><div class="pb-priority ${a.pri}">${a.label}</div></div>`).join('')}</div>`;}}
  renderChangeLog();
}

function updateListItem(acc){
  const s=document.getElementById(`ls-${acc.id}`),d=document.getElementById(`ld-${acc.id}`),li=document.querySelector(`.acc-item[data-id="${acc.id}"]`);
  if(s){s.textContent=acc.hs;s.className=`acc-score score-${tc(acc.tier)}`;}
  if(d)d.className=`rdot rdot-${tc(acc.tier)}`;
  if(li){li.dataset.tier=acc.tier;li.querySelector('.acc-meta').textContent=`${acc.ind} · ${acc.csm.split(' ')[0]}${acc.note?' · 📝':''}`;}
}

function saveNote(){
  const acc=ALL.find(a=>a.id===selectedId);if(!acc)return;
  const ta=document.getElementById('notes-input');if(!ta)return;
  acc.note=ta.value;acc.noteTs=new Date();
  document.getElementById('notes-chars').textContent=acc.note.length+' chars';
  const ts=acc.noteTs;document.getElementById('notes-ts').textContent=ts.getHours().toString().padStart(2,'0')+':'+ts.getMinutes().toString().padStart(2,'0');
  const saved=document.getElementById('notes-saved');saved.classList.add('show');setTimeout(()=>saved.classList.remove('show'),2000);
  updateListItem(acc);
}

function logChange(co,key,from,to,newScore){
  const now=new Date(),ts=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  const label={tickets:'Tickets',usage:'Usage',sentiment:'Sentiment','scenario applied':'Scenario'}[key]||key;
  changeLog.unshift({ts,co,label,from,to,newScore});
  if(changeLog.length>20)changeLog.pop();
}
function renderChangeLog(){
  const el=document.getElementById('rp-history');if(!el)return;
  if(!changeLog.length){el.innerHTML='<span style="font-size:11px;color:var(--muted);">No changes yet</span>';return;}
  el.innerHTML=changeLog.slice(0,10).map(c=>`<div class="history-item"><div class="hist-time">${c.ts} · ${c.co.split(' ')[0]}</div><div class="hist-change">${c.label}${c.from!=='—'?`: ${c.from} → ${c.to}`:' applied'} <span style="color:var(--muted2);">(${c.newScore})</span></div></div>`).join('');
}

function renderRightPanel(acc){
  const det=document.getElementById('rp-details');if(!det)return;
  det.innerHTML=`
    <div class="rp-row"><span class="rp-lbl">Industry</span><span class="rp-val">${acc.ind}</span></div>
    <div class="rp-row"><span class="rp-lbl">CSM</span><span class="rp-val" style="font-family:var(--sans);font-size:11px;">${acc.csm}</span></div>
    <div class="rp-row"><span class="rp-lbl">ARR</span><span class="rp-val">${fmtARR(acc.arr)}</span></div>
    <div class="rp-row"><span class="rp-lbl">Renewal</span><span class="rp-val">${acc.dtr}d</span></div>
    <div class="rp-row"><span class="rp-lbl">Health</span><span class="rp-val ${sc(acc.hs)}">${acc.hs}/100</span></div>`;
  const nw=document.getElementById('notes-wrap');if(nw)nw.style.display='block';
  const ta=document.getElementById('notes-input');if(ta){ta.value=acc.note||'';}
  document.getElementById('notes-chars').textContent=(acc.note||'').length+' chars';
  if(acc.noteTs){const ts=acc.noteTs;document.getElementById('notes-ts').textContent=ts.getHours().toString().padStart(2,'0')+':'+ts.getMinutes().toString().padStart(2,'0');}
}

function selectAccount(id){
  if(simMode&&selectedId!==null){const prev=ALL.find(a=>a.id===selectedId);if(prev){prev.simSignals=null;}simMode=false;}
  selectedId=id;
  const acc=ALL.find(a=>a.id===id);
  document.querySelectorAll('.acc-item').forEach(el=>el.classList.toggle('selected',parseInt(el.dataset.id)===id));
  renderCenter(acc);
  renderRightPanel(acc);
}

buildList();updateTopStats();
</script>
</body>
</html>
